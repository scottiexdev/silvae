name: ci

on:
  push:
  pull_request:
  # Un run che fallisce all'avvio, prima di qualsiasi job, non è ripetibile da
  # GitHub: senza un innesco manuale l'unico modo di riprovare sarebbe un
  # commit inventato.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silvae
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Silvae.sln
      - run: dotnet build Silvae.sln --no-restore --configuration Release
      - run: dotnet test Silvae.sln --no-build --configuration Release

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef
      - run: dotnet restore Silvae.sln

      # Il modello EF e le migrazioni devono restare allineati: senza questo
      # controllo una proprietà aggiunta al dominio raggiunge la produzione
      # senza la colonna corrispondente.
      - name: The EF model matches the migrations
        env:
          ConnectionStrings__Silvae: Host=localhost;Database=silvae;Username=postgres;Password=postgres
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/backend/Silvae.Infrastructure \
            --startup-project src/backend/Silvae.Api

      # Il client Dart è scritto sul contratto: se il contratto cambia senza
      # che nessuno se ne accorga, il client resta indietro in silenzio.
      - name: The published OpenAPI document matches docs/openapi.json
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          dotnet run --project src/backend/Silvae.Api \
            --no-launch-profile --urls http://127.0.0.1:5089 &
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5089/openapi/v1.json \
              --output published.json; then
              break
            fi
            sleep 2
          done
          test -s published.json
          python3 -m json.tool --indent 2 published.json published.json
          if ! diff -u docs/openapi.json published.json; then
            echo "::error::Il contratto OpenAPI è cambiato. Aggiorna il client Dart e rigenera docs/openapi.json con il workflow tools." >&2
            exit 1
          fi

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile/silvae_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test ../silvae_api_client/lib
      - run: flutter analyze
      - run: flutter test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API container image
        run: |
          docker build \
            --file src/backend/Silvae.Api/Dockerfile \
            --tag silvae-api:ci \
            .
      - name: Start the container without a connection string
        run: |
          docker run --rm --detach --name silvae-api-ci \
            --publish 8080:10000 \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            silvae-api:ci
      - name: Wait for /api/health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo
              echo "health check ok after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the API did not answer on /api/health" >&2
          docker logs silvae-api-ci >&2
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force silvae-api-ci || true
