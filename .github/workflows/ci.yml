name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silvae
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Silvae.sln
      - run: dotnet build Silvae.sln --no-restore --configuration Release
      - run: dotnet test Silvae.sln --no-build --configuration Release

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile/silvae_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test ../silvae_api_client/lib
      - run: flutter analyze
      - run: flutter test
